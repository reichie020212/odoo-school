# Don't touch legal text anywhere in the tree
exclude: '(LICENSE.*|COPYING.*)'

repos:
  # Local "fail" hooks — refuse to commit if these files exist
  - repo: local
    hooks:
      - id: en-po-files
        name: en.po files cannot exist
        entry: found a en.po file (Odoo source language is English)
        language: fail
        files: '[a-zA-Z0-9_]*/i18n/en\.po$'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # .po/.pot are autogenerated by Odoo's i18n export
        exclude: \.pot?$
      - id: end-of-file-fixer
        exclude: \.pot?$
      - id: check-yaml
      - id: check-xml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: debug-statements
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
