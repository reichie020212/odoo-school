# Optional reverse-proxy overlay for the production stack.
#
# Layered on top of docker-compose.yml + docker-compose.prod.yml — the
# nginx service joins the same default network as `odoo` and `db`, so
# the upstream definitions in docker/nginx/default.conf can address the
# Odoo container by its compose service name.
#
# Bring the full HTTP-fronted stack up with:
#
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.prod.yml \
#     -f docker-compose.nginx.yml \
#     up -d --build
#
# This overlay is HTTP-only on purpose. For TLS, add a 443 listener +
# certificate mount in a follow-up overlay (or terminate TLS at a
# load balancer / cloud provider in front of this nginx).

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - odoo
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # nginx:alpine ships busybox wget; the request hits the local
      # listener so we catch a misconfigured server block before the
      # container is reported healthy to dependents.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
