# Reverse-proxy config for the odoo-school stack.
#
# Mounted by docker-compose.nginx.yml at /etc/nginx/conf.d/default.conf.
# Routes /websocket to the gevent worker on :8072 (mandatory in Odoo 19
# — the regular HTTP workers cannot bind a websocket and will raise
# KeyError: 'socket' / "Couldn't bind the websocket. Is the connection
# opened on the evented port (8072)?" if the route lands on :8069).

# Use Docker's embedded DNS so the `odoo` service name resolves on the
# compose network. valid=10s lets nginx pick up a new container IP
# within ten seconds of an odoo restart without needing nginx itself to
# restart. ipv6=off because Docker's embedded DNS does not return AAAA
# records reliably for service names.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen      80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Odoo accepts large attachments (PDFs, scanned report cards, etc).
    # The default nginx 1 MB cap silently truncates uploads.
    client_max_body_size 256m;

    # Forwarded headers — pair these with proxy_mode = True in odoo.conf
    # so Odoo trusts them when building absolute URLs (login redirects,
    # email links, QWeb report assets).
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;

    # Odoo report generation and bulk imports routinely run past the
    # default 60s; bump to 12 minutes.
    proxy_connect_timeout 60s;
    proxy_read_timeout    720s;
    proxy_send_timeout    720s;

    # Websocket route. Must hit the gevent worker on :8072 and carry the
    # Upgrade headers. Using a variable in proxy_pass forces nginx to
    # resolve the upstream at request time via the resolver above —
    # otherwise nginx resolves once at boot and exits with "host not
    # found in upstream" if the odoo container is still starting up.
    location /websocket {
        set $odoo_ws "odoo:8072";
        proxy_pass http://$odoo_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Everything else hits the regular HTTP workers. Same lazy-resolve
    # trick — the variable defers DNS to request time.
    location / {
        set $odoo_http "odoo:8069";
        proxy_pass http://$odoo_http;
        proxy_redirect off;
    }
}
