# Reverse-proxy config for the odoo-school stack.
#
# Mounted by docker-compose.nginx.yml at /etc/nginx/conf.d/default.conf.
# Two upstreams — one to Odoo's regular HTTP workers, one to the gevent
# worker that owns the /websocket route. In Odoo 19 the regular workers
# physically cannot bind a websocket (they don't get the raw socket on
# the request), so any /websocket traffic that lands on :8069 ends with
# a KeyError: 'socket' and "Couldn't bind the websocket. Is the
# connection opened on the evented port (8072)?".

upstream odoo {
    server odoo:8069;
}

upstream odoo_gevent {
    server odoo:8072;
}

server {
    listen      80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Odoo accepts large attachments (PDFs, scanned report cards, etc).
    # The default nginx 1 MB cap silently truncates uploads.
    client_max_body_size 256m;

    # Forwarded headers — pair these with proxy_mode = True in odoo.conf
    # so Odoo trusts them when building absolute URLs (login redirects,
    # email links, QWeb report assets).
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;

    # Odoo report generation and bulk imports routinely run past the
    # default 60s; bump to 12 minutes.
    proxy_connect_timeout 60s;
    proxy_read_timeout    720s;
    proxy_send_timeout    720s;

    # Websocket route. Must hit the gevent upstream and carry the
    # Upgrade headers, otherwise the long-lived bus channel falls back
    # and the live notifications / chatter activity widget go silent.
    location /websocket {
        proxy_pass http://odoo_gevent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Everything else.
    location / {
        proxy_pass     http://odoo;
        proxy_redirect off;
    }
}
